name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main and must follow
# Conventional Commits (it drives release-please).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
          # Lowercase subjects, except Dependabot's fixed "Bump …" wording.
          subjectPattern: ^(?:(?![A-Z]).+|Bump .+)$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.
